name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Verify migrations match models (no drift)
        run: alembic check
      - name: Run tests
        run: python -m pytest tests/ -q

  # [GAP-017] 前端门禁。此前仓库**没有**前端 CI —— 这正是 #80/#81 引入动态路由时
  # 漏掉 generateStaticParams、把 APK 静态导出静默打挂却无人发现的原因
  # （tsc/next build 都不会报错，只有 APK_BUILD=1 才会）。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint（真 eslint；此前的 next lint 在 Next 16 下恒绿，#149）
        run: npm run lint
      - name: Mock 契约测试（127 断言；防枚举漂移，#149）
        run: npm run test:contract
      - name: 可访问性键盘测试（jsdom；包 LocaleProvider 后才不崩，#149）
        run: npm run test:a11y
      - name: Web build
        run: npx next build
      # [P1-3/#155] build-time const fail-fast regression: missing/loopback must FAIL.
      - name: 构建期常量校验 fail-fast（缺值必败）
        run: |
          set -euo pipefail
          if NEXT_PUBLIC_API_BASE=https://music.example.com node scripts/public-consts.mjs check >/dev/null 2>&1; then
            echo "::error::missing GOSPEL/FLOW_EVENTS_BASE but check passed -- fail-fast broken"
            exit 1
          fi
          if NEXT_PUBLIC_API_BASE=http://localhost:8000 \
             NEXT_PUBLIC_GOSPEL_API_BASE=https://anistar.studio \
             NEXT_PUBLIC_FLOW_EVENTS_BASE=https://anistar.studio \
             node scripts/public-consts.mjs check >/dev/null 2>&1; then
            echo "::error::loopback API base passed -- fail-fast broken"
            exit 1
          fi
          echo "fail-fast OK"
      - name: Web 静态导出 + CSP<meta> 注入（P1-3 回归：connect-src 含跨域/产物自检）
        run: |
          set -euo pipefail
          NEXT_PUBLIC_API_BASE=https://music.example.com \
          NEXT_PUBLIC_GOSPEL_API_BASE=https://anistar.studio \
          NEXT_PUBLIC_FLOW_EVENTS_BASE=https://anistar.studio \
          node scripts/build-web.mjs
          grep -q 'connect-src.*https://anistar.studio' out/index.html
          echo "build-web CSP OK"
      - name: Wave5 #150 regression: play count not inflated + no duplicate detail fetch
        run: npm run test:player
      - name: i18n 自检（词典 key 一致性 / 静态导出可枚举 / locale 持久化接线）
        run: node scripts/verify-i18n.mjs
      - name: PWA 自检（GAP-018 回归）
        run: node scripts/verify-pwa.mjs
      - name: APK 静态导出（Wave 1 硬验收：APK_BUILD=1 不得破）
        run: node scripts/build-apk.mjs --api=https://api.anistar.studio
      - name: 硬编码中文扫描（仅报告，不阻断）
        run: node scripts/scan-hardcoded-i18n.mjs
