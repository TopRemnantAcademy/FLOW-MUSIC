# .cnb.yml — 仓库根流水线（⚠ 必须在**仓库根**：放 `.cnb/` 目录内会注册失败 [CONFIG_YAML_EMPTY]）
#
# 职责分工（见 issue #165）：
#   ① 快活门禁 gate-fast（目标 < 60s）：单测 + 静态许可断言。挂 pull_request 与 push main，
#      每次提交都跑 —— 这类断言必须**永远自动执行**，否则回归只能靠人肉发现。
#   ② 重活门禁 gate-heavy：装对外 OMR 栈（~2.4 min）→ oemer 补丁 → 动态许可 → CV 冒烟。
#      **只挂 api_trigger**（手动触发），不进 push 路径，避免每次提交都装 79 个包。
#
# 硬约束：门禁失败必须非零退出。本文件**禁止**出现 `|| true` / `allowFailure: true`
#         之类吞错写法 —— 那等于把门禁变成"绿灯装饰"。
#
# 重活放在 `"$"` 兜底分支下（`api_trigger` 按**触发分支自身**的配置解析，
# 放 main 下就只能从 main 触发）。因 main 已被 glob 命中，`"$"` 实际覆盖其余分支。
#
# 触发方式（重活）：
#   cnb build start-build --repo flow.237/FLOW-MUSIC --branch <分支> \
#     --event api_trigger --title "165 heavy"
#
# 复用片段：快活门禁的脚本在 PR 与 push main 两处一致，用 YAML 锚点避免漂移。
# （锚点只复用 stages，docker 各自声明 —— 保持配置对读者扁平。）

# ---- 快活门禁（PR / push main 自动执行）--------------------------------------
"$":
  pull_request:
    - name: gate-fast
      docker:
        image: python:3.12-slim
      stages:
        - name: 单测（G1 自动判定 + 许可断言 + 图像门 + CV 冒烟契约）
          script: |
            set -eu
            pip install -q pytest
            python -m pytest \
              music_rebuild_project/tools/checks/tests/test_g1_auto.py \
              music_rebuild_project/tools/checks/tests/test_check_licenses.py \
              music_rebuild_project/tools/checks/tests/test_g1_image_quality.py \
              music_rebuild_project/deploy/omr-qa/tests/ \
              -q -p no:cacheprovider
        - name: 静态许可门禁（对外栈禁 AGPL/GPL）
          script: |
            set -eu
            python music_rebuild_project/tools/checks/check_licenses.py \
              --requirements music_rebuild_project/deploy/omr-qa/requirements-omr.txt

  # ---- 重活门禁：仅手动 api_trigger（不挂任何 push 路径）----------------------
  api_trigger:
    - name: gate-heavy
      docker:
        image: python:3.12-slim
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      stages:
        - name: 系统依赖（Tesseract 第二票 OCR）
          script: |
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends \
              tesseract-ocr tesseract-ocr-kor tesseract-ocr-chi-sim
            rm -rf /var/lib/apt/lists/*
        - name: 装对外 OMR 栈（钉版，见 requirements-omr.txt）
          script: |
            set -eu
            pip install --no-cache-dir \
              -r music_rebuild_project/deploy/omr-qa/requirements-omr.txt
          timeout: 30m
        - name: 强制 headless OpenCV（rapidocr 会拉非 headless 版覆盖它）
          script: |
            set -eu
            # rapidocr-onnxruntime 硬依赖 opencv-python（非 headless），与
            # opencv-python-headless 共用 cv2 包名 → 后装者胜，无头容器炸 libGL.so.1。
            # 卸掉非 headless 版并重装 headless；卸不掉时由下面 smoke_cv 红给看。
            pip uninstall -y opencv-python
            pip install --no-cache-dir --force-reinstall --no-deps opencv-python-headless
        - name: oemer 补丁（bbox.find_lines 形状；幂等）
          script: |
            set -eu
            python music_rebuild_project/deploy/omr-qa/apply_oemer_patch.py
        - name: 动态许可门禁（装栈后复扫，防传递依赖带入 GPL/AGPL）
          script: |
            set -eu
            python music_rebuild_project/tools/checks/check_licenses.py --env
        - name: CV 冒烟断言（无头容器 import cv2 不得报 libxcb.so.1）
          script: |
            set -eu
            python music_rebuild_project/deploy/omr-qa/smoke_cv.py \
              music_rebuild_project/02_source/song01/preprocessed/song01_preprocessed_v001.jpeg

    # ---- Mock 三套（#168 固化，仅 api_trigger；勿挂 PR/push，避免拖慢 fast gate）----
    - name: mock-backend-full
      docker:
        image: python:3.12-slim
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      stages:
        - name: 系统依赖 + 装后端依赖
          script: |
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends ffmpeg build-essential
            rm -rf /var/lib/apt/lists/*
            pip install --no-cache-dir -r backend/requirements.txt
          timeout: 30m
        - name: 后端 Mock 全量单测（排除 omr_e2e）
          script: |
            set -eu
            cd backend
            python -m pytest tests/ -q -p no:cacheprovider --ignore=tests/omr_e2e

    - name: mock-omr-e2e
      docker:
        image: python:3.12-slim
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      stages:
        - name: 装后端依赖
          script: |
            set -eu
            pip install --no-cache-dir -r backend/requirements.txt
          timeout: 30m
        - name: OMR 端到端 Mock 编排（tests/omr_e2e）
          script: |
            set -eu
            cd backend
            python -m pytest tests/omr_e2e/ -q -p no:cacheprovider

    # ---- 野上传 → 全链路 OMR（#169 固化，仅 api_trigger）------------------------
    # 三处断言（任一红即整 job 红，**不使用** `|| true` / `allowFailure`）：
    #   ① G1 门禁对低分辨率野图诚实 FAIL（tests/wild_omr/test_wild_upload_gate.py）
    #   ② oemer 有超时护栏、超时即 EngineUnavailable（…_oemer_timeout.py）
    #   ③ score_xml_validate 无拍号来源时只可 PASS_WITH_NOTES（…_xml_validate.py）
    # 之后在**真实 omr-qa 栈**上跑一遍 OMR（smoke_omr.py）证明栈没坏、失败没被吞。
    # 不挂 PR/push：装 79 个包 + 模型推理是重活，fast gate 只跑单测。
    - name: mock-omr-wild-upload
      docker:
        image: python:3.12-slim
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      stages:
        - name: 系统依赖（Tesseract 第二票 OCR）
          script: |
            set -eu
            apt-get update
            apt-get install -y --no-install-recommends \
              tesseract-ocr tesseract-ocr-kor tesseract-ocr-chi-sim
            rm -rf /var/lib/apt/lists/*
        - name: 装对外 OMR 栈（钉版，见 requirements-omr.txt）
          script: |
            set -eu
            pip install --no-cache-dir \
              -r music_rebuild_project/deploy/omr-qa/requirements-omr.txt
            pip install --no-cache-dir pytest
          timeout: 30m
        - name: 强制 headless OpenCV（rapidocr 会拉非 headless 版覆盖它）
          script: |
            set -eu
            pip uninstall -y opencv-python
            pip install --no-cache-dir --force-reinstall --no-deps opencv-python-headless
        - name: oemer 补丁 + 检查点预热（幂等；显式联网，不在测量路径里偷偷下载）
          script: |
            set -eu
            python music_rebuild_project/deploy/omr-qa/apply_oemer_patch.py
            python - <<'EOF'
            import sys
            sys.path.insert(0, "music_rebuild_project/tools")
            from checks.g1_auto import warm_oemer_checkpoints
            print(warm_oemer_checkpoints())
            EOF
          timeout: 20m
        - name: ① G1 门禁诚实 FAIL + ② oemer 超时护栏 + ③ XML 校验不静默 PASS
          script: |
            set -eu
            python -m pytest tests/wild_omr/ -q -p no:cacheprovider
        - name: 野上传 OMR 冒烟（真实栈；引擎降级必须被归类，失败不得被吞）
          script: |
            set -eu
            python tests/wild_omr/smoke_omr.py \
              --image tests/wild_omr/fixtures/song01_preprocessed_v001_blur300.jpeg \
              --engines oemer \
              --assert-fail-closed tests/wild_omr/
          timeout: 45m

    - name: frontend-contract
      docker:
        image: node:22
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      stages:
        - name: 装前端依赖
          script: |
            set -eu
            cd frontend
            npm ci
          timeout: 20m
        - name: 契约测试（contract + player + a11y）
          script: |
            set -eu
            cd frontend
            npm run test:contract
            npm run test:player
            npm run test:a11y

main:
  push:
    - name: gate-fast
      docker:
        image: python:3.12-slim
      stages:
        - name: 单测（G1 自动判定 + 许可断言 + 图像门 + CV 冒烟契约）
          script: |
            set -eu
            pip install -q pytest
            python -m pytest \
              music_rebuild_project/tools/checks/tests/test_g1_auto.py \
              music_rebuild_project/tools/checks/tests/test_check_licenses.py \
              music_rebuild_project/tools/checks/tests/test_g1_image_quality.py \
              music_rebuild_project/deploy/omr-qa/tests/ \
              -q -p no:cacheprovider
        - name: 静态许可门禁（对外栈禁 AGPL/GPL）
          script: |
            set -eu
            python music_rebuild_project/tools/checks/check_licenses.py \
              --requirements music_rebuild_project/deploy/omr-qa/requirements-omr.txt
